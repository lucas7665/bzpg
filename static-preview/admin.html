<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 标准AI立方</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">标准AI立方</div>
                <div class="admin-title">管理后台</div>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-link active">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">数据概览</span>
                </a>
                <a href="#standards" class="nav-link">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">标准库</span>
                </a>
                <a href="#system" class="nav-link">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">体系维护</span>
                </a>
                <a href="#management" class="nav-link">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">标准管理</span>
                </a>
                <a href="#users" class="nav-link">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">用户管理</span>
                </a>
                <a href="#roles" class="nav-link">
                    <span class="nav-icon">🔐</span>
                    <span class="nav-text">角色管理</span>
                </a>
                <a href="#statistics" class="nav-link">
                    <span class="nav-icon">📈</span>
                    <span class="nav-text">统计</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="admin-main">
            <!-- 顶部栏 -->
            <header class="admin-header">
                <div class="header-left">
                    <h1 class="page-title">数据概览</h1>
                </div>
                <div class="header-right">
                    <span class="user-name">管理员</span>
                    <button class="logout-btn">退出</button>
                </div>
            </header>

            <!-- 内容区域 -->
            <div class="admin-content">
                <!-- 统计卡片 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📚</div>
                        <div class="stat-info">
                            <div class="stat-value">220,000+</div>
                            <div class="stat-label">标准总数</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🏭</div>
                        <div class="stat-info">
                            <div class="stat-value">76</div>
                            <div class="stat-label">行业分类</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <div class="stat-value">1,234</div>
                            <div class="stat-label">注册用户</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📊</div>
                        <div class="stat-info">
                            <div class="stat-value">5,678</div>
                            <div class="stat-label">今日访问</div>
                        </div>
                    </div>
                </div>

                <!-- 数据管理区域 -->
                <div class="content-section">
                    <h2 class="section-title">标准库管理</h2>
                    <div class="action-bar">
                        <button class="btn btn-primary">导入标准</button>
                        <button class="btn btn-secondary">批量操作</button>
                        <div class="search-box-admin">
                            <input type="text" placeholder="搜索标准..." class="search-input-admin">
                            <button class="search-btn-admin">搜索</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox"></th>
                                    <th>标准号</th>
                                    <th>标准名称</th>
                                    <th>行业/城市</th>
                                    <th>状态</th>
                                    <th>发布日期</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="checkbox"></td>
                                    <td>GB/T 19488-2004</td>
                                    <td>电子政务数据元 第1部分 基础</td>
                                    <td>信息技术</td>
                                    <td><span class="badge badge-success">现行</span></td>
                                    <td>2004-04-30</td>
                                    <td>
                                        <button class="action-btn">编辑</button>
                                        <button class="action-btn">删除</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td><input type="checkbox"></td>
                                    <td>DB11/T 1234-2020</td>
                                    <td>北京市地方标准示例</td>
                                    <td>北京</td>
                                    <td><span class="badge badge-success">现行</span></td>
                                    <td>2020-01-15</td>
                                    <td>
                                        <button class="action-btn">编辑</button>
                                        <button class="action-btn">删除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
