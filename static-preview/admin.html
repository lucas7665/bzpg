<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 标准AI立方</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">标准AI立方</div>
                <div class="admin-title">管理后台</div>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-link active">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">数据概览</span>
                </a>
                <a href="#standards" class="nav-link">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">标准库</span>
                </a>
                <a href="#system" class="nav-link active">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">体系维护</span>
                </a>
                <a href="#management" class="nav-link">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">标准管理</span>
                </a>
                <a href="#users" class="nav-link">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">用户管理</span>
                </a>
                <a href="#roles" class="nav-link">
                    <span class="nav-icon">🔐</span>
                    <span class="nav-text">角色管理</span>
                </a>
                <a href="#statistics" class="nav-link">
                    <span class="nav-icon">📈</span>
                    <span class="nav-text">统计</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="admin-main">
            <!-- 顶部栏 -->
            <header class="admin-header">
                <div class="header-left">
                    <h1 class="page-title">体系维护</h1>
                </div>
                <div class="header-right">
                    <span class="user-name">管理员</span>
                    <button class="logout-btn">退出</button>
                </div>
            </header>

            <!-- 内容区域 -->
            <div class="admin-content">
                <!-- 操作栏 -->
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="location.href='system-create.html'">创建新体系</button>
                    <div class="search-box-admin">
                        <input type="text" placeholder="搜索标准体系..." class="search-input-admin">
                        <button class="search-btn-admin">搜索</button>
                    </div>
                </div>

                <!-- 体系列表 -->
                <div class="content-section">
                    <h2 class="section-title">标准体系列表</h2>
                    <div class="system-list-admin">
                        <div class="system-card-admin">
                            <div class="system-card-header">
                                <div class="system-info-main">
                                    <h3 class="system-name-admin">电子政务标准体系</h3>
                                    <div class="system-meta-admin">
                                        <span class="meta-badge-admin">公开</span>
                                        <span class="meta-item-admin">标准数量：156</span>
                                        <span class="meta-item-admin">分类数量：8</span>
                                        <span class="meta-item-admin">创建时间：2025-01-10</span>
                                    </div>
                                </div>
                                <div class="system-actions-admin">
                                    <button class="btn btn-secondary btn-sm" onclick="location.href='system-detail.html'">查看详情</button>
                                    <button class="btn btn-secondary btn-sm" onclick="location.href='system-edit.html'">编辑</button>
                                    <button class="btn btn-danger btn-sm">删除</button>
                                </div>
                            </div>
                            <div class="system-desc-admin">
                                涵盖电子政务数据元、数据交换、信息安全、电子签名、电子文件管理等相关标准
                            </div>
                        </div>

                        <div class="system-card-admin">
                            <div class="system-card-header">
                                <div class="system-info-main">
                                    <h3 class="system-name-admin">智慧城市标准体系</h3>
                                    <div class="system-meta-admin">
                                        <span class="meta-badge-admin">公开</span>
                                        <span class="meta-item-admin">标准数量：89</span>
                                        <span class="meta-item-admin">分类数量：5</span>
                                        <span class="meta-item-admin">创建时间：2025-01-08</span>
                                    </div>
                                </div>
                                <div class="system-actions-admin">
                                    <button class="btn btn-secondary btn-sm" onclick="location.href='system-detail.html'">查看详情</button>
                                    <button class="btn btn-secondary btn-sm" onclick="location.href='system-edit.html'">编辑</button>
                                    <button class="btn btn-danger btn-sm">删除</button>
                                </div>
                            </div>
                            <div class="system-desc-admin">
                                包含智慧城市基础设施、数据管理、应用服务、信息安全等标准
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
