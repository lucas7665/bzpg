<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 标准数字化V1</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-large">标准数字化V1</div>
                <p class="login-subtitle">智能标准化服务平台</p>
            </div>
            
            <div class="login-tabs">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>

            <!-- 登录表单 -->
            <form class="login-form active" id="loginForm">
                <div class="form-group">
                    <label>用户名/邮箱</label>
                    <input type="text" class="form-input" placeholder="请输入用户名或邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" class="form-input" placeholder="请输入密码" required>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> 记住我
                    </label>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
                <div class="login-divider">
                    <span>或</span>
                </div>
                <div class="social-login">
                    <button type="button" class="social-btn">微信登录</button>
                    <button type="button" class="social-btn">企业账号登录</button>
                </div>
            </form>

            <!-- 注册表单 -->
            <form class="login-form" id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" class="form-input" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" class="form-input" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" class="form-input" placeholder="请输入密码（至少8位）" required>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" class="form-input" placeholder="请再次输入密码" required>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" required> 我已阅读并同意
                        <a href="#">《用户协议》</a> 和
                        <a href="#">《隐私政策》</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>

            <div class="login-footer">
                <a href="index.html" class="back-link">← 返回首页</a>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
