<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户后台 - 标准AI立方</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
    <div class="user-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">标准AI立方</div>
                <div class="user-title">用户后台</div>
            </div>
            <nav class="sidebar-nav">
                <a href="#system" class="nav-link active">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">体系维护</span>
                </a>
                <a href="#organization" class="nav-link">
                    <span class="nav-icon">🏢</span>
                    <span class="nav-text">组织管理</span>
                </a>
                <a href="#statistics" class="nav-link">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">信息统计</span>
                </a>
                <a href="#standards" class="nav-link">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">标准服务</span>
                </a>
                <a href="#ai" class="nav-link">
                    <span class="nav-icon">🤖</span>
                    <span class="nav-text">标准大模型</span>
                </a>
                <a href="#portal" class="nav-link">
                    <span class="nav-icon">🌐</span>
                    <span class="nav-text">门户管理</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="user-main">
            <!-- 顶部栏 -->
            <header class="user-header">
                <div class="header-left">
                    <h1 class="page-title">体系维护</h1>
                </div>
                <div class="header-right">
                    <span class="user-name">用户</span>
                    <button class="logout-btn">退出</button>
                </div>
            </header>

            <!-- 内容区域 -->
            <div class="user-content">
                <!-- 我的标准体系 -->
                <div class="content-section">
                    <div class="section-header">
                        <h2 class="section-title">我的标准体系</h2>
                        <button class="btn btn-primary">创建新体系</button>
                    </div>
                    
                    <div class="system-grid">
                        <div class="system-card">
                            <div class="system-header">
                                <h3 class="system-name">企业内部标准体系</h3>
                                <div class="system-badge">内部</div>
                            </div>
                            <div class="system-stats">
                                <div class="stat">
                                    <span class="stat-label">标准数量</span>
                                    <span class="stat-value">45</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-label">分类数量</span>
                                    <span class="stat-value">8</span>
                                </div>
                            </div>
                            <div class="system-actions">
                                <button class="btn-small">查看</button>
                                <button class="btn-small">编辑</button>
                                <button class="btn-small">管理</button>
                            </div>
                        </div>

                        <div class="system-card">
                            <div class="system-header">
                                <h3 class="system-name">项目标准体系</h3>
                                <div class="system-badge">项目</div>
                            </div>
                            <div class="system-stats">
                                <div class="stat">
                                    <span class="stat-label">标准数量</span>
                                    <span class="stat-value">23</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-label">分类数量</span>
                                    <span class="stat-value">5</span>
                                </div>
                            </div>
                            <div class="system-actions">
                                <button class="btn-small">查看</button>
                                <button class="btn-small">编辑</button>
                                <button class="btn-small">管理</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 体系分类 -->
                <div class="content-section">
                    <h2 class="section-title">体系分类</h2>
                    <div class="category-tree">
                        <div class="category-item">
                            <div class="category-name">核心标准</div>
                            <div class="category-count">12个标准</div>
                        </div>
                        <div class="category-item">
                            <div class="category-name">基础标准</div>
                            <div class="category-count">8个标准</div>
                        </div>
                        <div class="category-item">
                            <div class="category-name">应用标准</div>
                            <div class="category-count">15个标准</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
